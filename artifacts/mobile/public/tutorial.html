<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thiba Cautelas — Como Usar</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0b1120;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px 24px;
  color: white;
  overflow-x: hidden;
}

/* ── HEADER ─────────────────────────────────── */
.header { text-align: center; margin-bottom: 22px; }
.logo-row {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 6px;
}
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #1e3a8a, #4f46e5);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 24px rgba(79,70,229,0.45);
}
.logo-text {
  font-size: 26px; font-weight: 800;
  background: linear-gradient(135deg, #ffffff, #93c5fd);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.header p { color: #64748b; font-size: 13.5px; letter-spacing: 0.02em; }

/* ── LAYOUT PRINCIPAL ─────────────────────────── */
.stage {
  display: flex;
  gap: 28px;
  align-items: center;
  width: 100%;
  max-width: 920px;
  margin-bottom: 18px;
}

/* ── TELEFONE ──────────────────────────────────── */
.phone-wrap { flex-shrink: 0; }
.phone {
  width: 250px;
  height: 510px;
  background: #0f172a;
  border-radius: 34px;
  border: 7px solid #1e293b;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
  position: relative;
  overflow: hidden;
}
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 90px; height: 18px;
  background: #1e293b;
  border-radius: 0 0 14px 14px;
  z-index: 5;
}
.phone-screen {
  position: absolute; inset: 0;
  background: #F5F6FA;
  overflow: hidden;
}
.screen-status {
  height: 22px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  font-size: 10px; font-weight: 700; color: #0f172a;
  background: transparent;
  position: relative; z-index: 4;
}

/* ── TELAS SIMULADAS ───────────────────────────── */
.screen { position: absolute; inset: 0; top: 22px; animation: screenIn .4s ease forwards; }
@keyframes screenIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

.s-header {
  background: linear-gradient(135deg, #101f3b, #1e3a8a, #4f46e5);
  padding: 14px 16px 16px;
  color: white;
}
.s-header.green { background: linear-gradient(135deg, #064e3b, #15803d); }
.s-eyebrow { font-size: 7px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.s-title { font-size: 15px; font-weight: 800; margin-top: 2px; line-height: 1.2; }
.s-sub { font-size: 8.5px; opacity: .7; margin-top: 3px; }

.s-body { padding: 12px 14px; font-size: 9px; color: #1e293b; }
.field-label {
  font-size: 7px; font-weight: 700; color: #64748b;
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; margin-top: 9px;
}
.field-box {
  border: 1px solid #d8dce5; background: white;
  border-radius: 8px; padding: 7px 9px;
  font-size: 9px; color: #1e293b;
  display: flex; align-items: center; justify-content: space-between;
}
.field-box.filled { border-color: #1e3a8a; color: #1e3a8a; font-weight: 700; }
.field-box.glow { animation: fieldGlow 1s ease; }
@keyframes fieldGlow {
  0% { box-shadow: 0 0 0 0 rgba(30,58,138,0.4); }
  50% { box-shadow: 0 0 0 4px rgba(30,58,138,0.25); }
  100% { box-shadow: 0 0 0 0 rgba(30,58,138,0); }
}
.btn-pill {
  margin-top: 12px;
  background: #1e3a8a; color: white;
  text-align: center; padding: 9px;
  border-radius: 9px; font-size: 9.5px; font-weight: 800;
}
.btn-pill.green { background: #15803d; }
.row-2 { display: flex; gap: 6px; }
.row-2 > * { flex: 1; }

/* Dashboard */
.stat-row { display: flex; gap: 5px; margin-top: 10px; }
.stat-pill {
  flex: 1; background: rgba(255,255,255,0.12);
  border-radius: 8px; padding: 6px 4px; text-align: center;
}
.stat-num { font-size: 13px; font-weight: 800; }
.stat-lbl { font-size: 5.5px; text-transform: uppercase; letter-spacing: .04em; opacity: .8; margin-top: 1px; }
.card-mini {
  background: white; border: 1px solid #e8eaf0; border-radius: 9px;
  padding: 9px; margin-top: 9px;
}
.card-mini-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.card-mini-id { font-size: 9px; font-weight: 800; color: #1e293b; }
.badge-mini {
  font-size: 6.5px; font-weight: 800; padding: 2px 6px; border-radius: 99px;
}
.badge-pend { background: #fef3c7; color: #92400e; }
.badge-ok   { background: #dcfce7; color: #166534; }
.card-mini-sub { font-size: 7.5px; color: #64748b; }

/* PIN keypad */
.pin-dots { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
.pin-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #94a3b8; }
.pin-dot.on { background: #1e3a8a; border-color: #1e3a8a; }
.keypad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 10px; }
.key {
  background: white; border: 1px solid #e2e6ee; border-radius: 8px;
  text-align: center; padding: 6px 0; font-size: 10px; font-weight: 700; color: #1e293b;
}

/* Toast sincronização */
.sync-toast {
  position: absolute; left: 10px; right: 10px; bottom: 12px;
  background: #0f172a; color: #4ade80;
  border-radius: 9px; padding: 7px 10px;
  font-size: 7.5px; font-weight: 700;
  display: flex; align-items: center; gap: 5px;
  opacity: 0; transform: translateY(8px);
  animation: toastIn .4s ease .6s forwards;
}
@keyframes toastIn { to { opacity: 1; transform: translateY(0); } }

/* ── STEP PANEL ────────────────────────────────── */
.panel-side { flex: 1; min-width: 0; }
.step-meta {
  font-size: 10px; font-weight: 700; color: #60a5fa;
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px;
}
.step-title { font-size: 21px; font-weight: 800; color: white; margin-bottom: 8px; line-height: 1.25; }
.step-desc  { font-size: 13.5px; color: #94a3b8; line-height: 1.6; margin-bottom: 14px; }
.step-bubble {
  background: rgba(79,70,229,0.12);
  border: 1px solid rgba(96,165,250,0.3);
  border-radius: 14px;
  padding: 13px 15px;
  font-size: 12px; color: #c7d2fe;
  white-space: pre-line; line-height: 1.6;
  animation: fadeUp .4s ease forwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── TIMELINE ──────────────────────────────────── */
.timeline { display: flex; align-items: center; width: 100%; max-width: 920px; margin-top: 6px; }
.tl-item {
  display: flex; flex-direction: column; align-items: center;
  flex: 1; gap: 6px; cursor: pointer; transition: opacity .3s;
}
.tl-item:hover { opacity: .85; }
.tl-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.15);
  transition: all .35s ease; position: relative; z-index: 1;
}
.tl-item.done .tl-dot   { background: rgba(96,165,250,.5); border-color: rgba(96,165,250,.5); }
.tl-item.active .tl-dot {
  background: #4f46e5; border-color: #818cf8;
  box-shadow: 0 0 0 4px rgba(79,70,229,.25); transform: scale(1.4);
}
.tl-label { font-size: 8.5px; font-weight: 600; color: #475569; text-align: center; line-height: 1.3; transition: color .3s; }
.tl-item.active .tl-label { color: #c7d2fe; }
.tl-item.done  .tl-label  { color: #93c5fd; }
.tl-line { flex: 1; height: 2px; background: rgba(255,255,255,0.08); margin-top: -22px; }
.tl-line.filled { background: rgba(96,165,250,.4); }

/* ── PROGRESS BAR ──────────────────────────────── */
.progress-bar {
  width: 100%; max-width: 920px; height: 3px;
  background: rgba(255,255,255,0.07); border-radius: 2px;
  margin-top: 14px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #4f46e5, #818cf8);
  border-radius: 2px; transition: width .08s linear; width: 0%;
}

/* ── CONTROLS ──────────────────────────────────── */
.controls { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
.ctrl-btn {
  padding: 9px 18px; border: none; border-radius: 10px;
  cursor: pointer; font-weight: 700; font-size: 12px; transition: all .2s; outline: none;
}
.ctrl-primary { background: #4f46e5; color: white; }
.ctrl-primary:hover { background: #4338ca; }
.ctrl-ghost { background: rgba(255,255,255,0.07); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
.ctrl-ghost:hover { background: rgba(255,255,255,0.12); color: white; }
.ctrl-speed { background: rgba(255,255,255,0.05); color: #64748b; border: 1px solid rgba(255,255,255,0.08); font-size: 11px; }
.ctrl-speed:hover { color: #93c5fd; }
.speed-active { color: #818cf8 !important; border-color: rgba(96,165,250,.4) !important; }

/* ── RESTART OVERLAY ───────────────────────────── */
.restart-overlay {
  position: fixed; inset: 0; background: rgba(11,17,32,0.88);
  backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .5s ease;
  padding: 24px; text-align: center;
}
.restart-overlay.visible { opacity: 1; pointer-events: all; }
.restart-title { font-size: 26px; font-weight: 800; color: white; }
.restart-sub   { font-size: 14px; color: #64748b; max-width: 360px; }
.restart-btn {
  margin-top: 10px; padding: 14px 32px; background: #4f46e5; color: white;
  border: none; border-radius: 14px; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: background .2s;
}
.restart-btn:hover { background: #4338ca; }

.wm { position: fixed; bottom: 14px; right: 18px; font-size: 11px; color: rgba(255,255,255,0.12); font-weight: 600; letter-spacing: 0.05em; pointer-events: none; }

@media (max-width: 760px) {
  .stage { flex-direction: column; }
  .phone { width: 220px; height: 450px; }
}
</style>
</head>

    desc: 'Informe de onde saiu, para onde vai, e os dados do container/lacre. Depois, toque em Salvar.',
    bubble: '📝 Preencheu errado?\nPode editar antes\nde finalizar.',
  },
  {
    screen: 'sync',
    meta: 'Etapa 6 de 8',
    title: 'Sincroniza Automaticamente',
    desc: 'Pronto! Sua cautela já aparece para o gestor em tempo real — sem precisar apertar nenhum botão de "enviar".',
    bubble: '☁️ Mesmo sem internet\nno momento, ela\nsincroniza assim que\nconectar de novo.',
  },
  {
    screen: 'finalizar',
    meta: 'Etapa 7 de 8',
    title: 'Na Entrega, Finalize',
    desc: 'Ao entregar, abra a cautela e toque em "Finalizar Cautela". Preencha quem recebeu, o RG, e confirme.',
    bubble: '✅ Esse é o passo que\ncomprova a entrega —\nnão pule essa etapa!',
  },
  {
    screen: 'concluida',
    meta: 'Etapa 8 de 8',
    title: 'Cautela Concluída',
    desc: 'A movimentação fica registrada com todo o histórico — data, hora, motorista e recebedor. Pronto, é só isso!',
    bubble: '🏆 Simples assim.\nQualquer dúvida, fale\ncom o gestor.',
  },
];

/* ── STATE ─────────────────────────────────────────────────── */
let current  = 0;
let playing  = true;
let speeds   = [1, 1.5, 2];
let speedIdx = 0;
let stepMs   = () => 4200 / speeds[speedIdx];
let raf      = null;
let autoId   = null;

function buildTimeline() {
  let html = '';
  STEPS.forEach((_, i) => {
    if (i > 0) html += `<div class="tl-line" id="tll${i}"></div>`;
    html += `
      <div class="tl-item" id="tli${i}" onclick="goTo(${i})">
        <div class="tl-dot"></div>
        <div class="tl-label">${i + 1}</div>
      </div>`;
  });
  document.getElementById('timeline').innerHTML = html;
}

function renderStep(idx) {
  const s = STEPS[idx];
  document.getElementById('phoneScreen').innerHTML = SCREENS[s.screen];
  document.getElementById('stepMeta').textContent  = s.meta;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('stepDesc').textContent  = s.desc;
  refloatBubble(s.bubble);

  STEPS.forEach((_, i) => {
    const item = document.getElementById(`tli${i}`);
    item.className = 'tl-item' + (i === idx ? ' active' : i < idx ? ' done' : '');
    if (i > 0) {
      const line = document.getElementById(`tll${i}`);
      line.className = 'tl-line' + (i <= idx ? ' filled' : '');
    }
  });
}

function refloatBubble(text) {
  const el = document.getElementById('stepBubble');
  el.style.animation = 'none';
  el.offsetHeight;
  el.textContent = text;
  el.style.animation = '';
}

function startTimer() {
  if (raf) cancelAnimationFrame(raf);
  const t0 = performance.now();
  const fill = document.getElementById('progressFill');
  function tick(now) {
    const pct = Math.min(100, ((now - t0) / stepMs()) * 100);
    fill.style.width = pct + '%';
    if (pct < 100 && playing) raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
}
function stopTimer() {
  if (raf) cancelAnimationFrame(raf);
  document.getElementById('progressFill').style.width = '0%';
}

function goTo(idx) {
  current = idx;
  renderStep(current);
  if (playing) { clearTimeout(autoId); startTimer(); scheduleNext(); }
}
function nextStep() {
  current = current + 1;
  if (current >= STEPS.length) { showRestart(); return; }
  renderStep(current);
  if (playing) { startTimer(); scheduleNext(); }
}
function prevStep() {
  clearTimeout(autoId);
  current = Math.max(0, current - 1);
  renderStep(current);
  if (playing) { startTimer(); scheduleNext(); }
}
function scheduleNext() {
  clearTimeout(autoId);
  autoId = setTimeout(nextStep, stepMs());
}
function showRestart() {
  playing = false;
  clearTimeout(autoId);
  stopTimer();
  document.getElementById('playBtn').textContent = '▶ Iniciar';
  document.getElementById('restartOverlay').classList.add('visible');
}
function restart() {
  document.getElementById('restartOverlay').classList.remove('visible');
  current = 0;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Pausar';
  renderStep(current);
  startTimer();
  scheduleNext();
}
function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('playBtn');
  if (playing) {
    btn.textContent = '⏸ Pausar';
    startTimer(); scheduleNext();
  } else {
    btn.textContent = '▶ Retomar';
    clearTimeout(autoId);
    if (raf) cancelAnimationFrame(raf);
  }
}
function cycleSpeed() {
  speedIdx = (speedIdx + 1) % speeds.length;
  const btn = document.getElementById('speedBtn');
  btn.textContent = speeds[speedIdx] + '× velocidade';
  btn.classList.toggle('speed-active', speedIdx > 0);
  if (playing) { clearTimeout(autoId); startTimer(); scheduleNext(); }
}

/* ── INIT ──────────────────────────────────────────────────── */
buildTimeline();
renderStep(0);
startTimer();
scheduleNext();
</script>
</body>
